services:
  postgres:
    image: postgres:16-alpine
    container_name: backeri-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backeri
      POSTGRES_PASSWORD: backeri_dev_password
      POSTGRES_DB: backeri
    ports:
      - "5432:5432"
    volumes:
      - backeri_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backeri -d backeri"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: backeri-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - backeri_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backeri_pg_data:
  backeri_redis_data:
